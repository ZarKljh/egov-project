# ============================================
# workspace-egov - Docker Compose (이미지 최소화 구성)
# ============================================
# 사용: docker compose up -d
# 전제: Spring Boot DB URL은 Docker 환경에서 postgres 서비스명 사용 필요
#       (context-datasource.xml 또는 globals.properties에서 host를 postgres로 설정)
# ============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: workspace-egov-postgres
    environment:
      POSTGRES_DB: egov-postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 서버 공인 IP: 배포 서버가 다르면 build.args 값 수정 후 재빌드 필요
  frontend-nextjs:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://49.50.132.115:8000/api
        NEXT_PUBLIC_SPRINGBOOT_API_URL: http://49.50.132.115:8080
    container_name: workspace-egov-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://49.50.132.115:8000/api
      NEXT_PUBLIC_SPRINGBOOT_API_URL: http://49.50.132.115:8080
    depends_on:
      - auth-php
      - egov-springboot

  auth-php:
    build:
      context: ./auth-php
      dockerfile: Dockerfile
    container_name: workspace-egov-auth-php
    ports:
      - "8000:8000"
    environment:
      # 로그인/토큰 생성에 필요 (운영 시 값 변경 권장)
      APP_KEY: base64:CH8fwAUcDztKYZUM6g2NTGG4aG00jQUCnobu9sY3ESf8=
      JWT_SECRET: CH8fwAUcDztKYZUM6g2NTGG4aG00jQUCnobu9sY3ESf87ilLL1B7xVOvsQTPnfUD
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: egov-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: "1234"
      APP_URL: http://49.50.132.115:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend-nextjs:3000,http://49.50.132.115:3000
      SPRINGBOOT_REDIRECT_URL: http://egov-springboot:8080/springboot
    volumes:
      - auth_php_storage:/var/www/html/storage
      - auth_php_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy

  egov-springboot:
    build:
      context: ./egov.springboot
      dockerfile: Dockerfile
    container_name: workspace-egov-springboot
    ports:
      - "8080:8080"
    environment:
      CATALINA_OPTS: "-Djdbc.url=jdbc:postgresql://postgres:5432/egov-postgres -Djdbc.username=postgres -Djdbc.password=1234"
    depends_on:
      postgres:
        condition: service_healthy

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: workspace-egov-npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend-nextjs
      - auth-php
      - egov-springboot

volumes:
  postgres_data:
  auth_php_storage:
  auth_php_bootstrap_cache:
  npm_data:
  npm_letsencrypt:
